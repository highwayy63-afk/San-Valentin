<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Para Valia 💖</title>

<style>
body {
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    font-family: 'Arial', sans-serif;
    text-align: center;
    height: 100vh;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
}

.card {
    background: white;
    padding: 40px;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    width: 90%;
    max-width: 400px;
}

h1 {
    color: #e91e63;
    font-size: 28px;
}

p {
    font-size: 18px;
}

.buttons {
    margin-top: 25px;
    position: relative;
    height: 80px;
}

button {
    padding: 12px 25px;
    font-size: 16px;
    border: none;
    border-radius: 25px;
    cursor: pointer;
    transition: 0.3s;
}

#yes {
    background: #e91e63;
    color: white;
}

#yes:hover {
    background: #c2185b;
}

#no {
    background: #ccc;
    position: absolute;
}

.heart {
    font-size: 40px;
    animation: latido 1s infinite;
}

@keyframes latido {
    0% { transform: scale(1); }
    50% { transform: scale(1.3); }
    100% { transform: scale(1); }
}
</style>
</head>

<body>

<div class="card">
    <div class="heart">💖</div>

    <h1>Valia 💕</h1>

    <p>
        Desde que llegaste a mi vida,<br>
        todo es más bonito ✨<br><br>
        ¿Quieres ser mi San Valentín? 💘
    </p>

    <div class="buttons">
        <button id="yes">💖 Sí 💖</button>
        <button id="no">No 🙈</button>
    </div>
</div>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");

noBtn.addEventListener("mouseover", () => {
    const x = Math.random() * 250;
    const y = Math.random() * 60;

    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
});

yesBtn.addEventListener("click", () => {
    document.body.innerHTML = `
        <div style="
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            height:100vh;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            font-family:Arial;
            text-align:center;
        ">

            <h1 style="color:#e91e63;">💘 Sabía que dirías que sí 💘</h1>

            <p style="font-size:22px;">
                Gracias por hacerme tan feliz, Valia ❤️<br>
                Te quiero mucho 😘
            </p>

            <div style="font-size:50px;">🥰💖😍💘</div>
        </div>
    `;
});
</script>

</body>
</html>
